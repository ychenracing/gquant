name: Capture source economic sequences
on:
  push:
    branches: [codex/gquant-architecture]
    paths: ['.github/workflows/capture-source.yml']
permissions:
  contents: write
concurrency:
  group: gquant-source-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gquant-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Capture the original engine, without parameter or data changes
        env:
          PYTHONPATH: .
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python .github/scripts/capture_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: economic-source-sequences
          path: tests/fixtures/economic_sequences.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve the independent source baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/economic_sequences.json
          git diff --cached --check
          git commit -m 'test: freeze complete pre-refactor economic paths'
          git push origin HEAD:refs/heads/codex/gquant-architecture
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
