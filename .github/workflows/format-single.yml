name: Temporary single-file format capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: |
          python -m ruff check --fix src/gquant/execution/account_events.py
          python -m ruff format src/gquant/execution/account_events.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: formatted-account-events-${{ github.event.pull_request.head.sha }}
          path: src/gquant/execution/account_events.py
          if-no-files-found: error
