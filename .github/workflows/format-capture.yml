name: Temporary format capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - run: |
          python -m ruff format .
          mkdir -p outputs/format
          git diff -- src tests scripts > outputs/format/format.patch
          git diff --name-only -- src tests scripts > outputs/format/files.txt
          git diff --exit-code -- .github || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: formatted-${{ github.event.pull_request.head.sha }}
          path: outputs/format/
          if-no-files-found: error
