name: Prepare validation tools
on:
  push:
    branches: [codex/gquant-architecture]
    paths: ['.github/workflows/prepare-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download development wheels
        run: |
          python -m pip download --only-binary=:all: --dest wheels ruff==0.12.12 mypy==1.17.1 bandit==1.8.6 build==1.3.0 wheel==0.45.1 pytest==8.3.5 pytest-cov==6.2.1 pandas-stubs==2.2.3.250308 pip-audit==2.9.0 setuptools==82.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: validation-wheels
          path: wheels
          if-no-files-found: error
          retention-days: 7
