name: Engineering and economic verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GQUANT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

jobs:
  engineering:
    name: Engineering Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.13.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.GQUANT_SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Record exact source and environment
        run: |
          test "$(git rev-parse HEAD)" = "$GQUANT_SOURCE_REVISION"
          mkdir -p outputs/engineering
          git rev-parse HEAD > outputs/engineering/source-sha.txt
          git ls-tree -r HEAD > outputs/engineering/source-tree.txt
          python -VV > outputs/engineering/python.txt
          python -m pip freeze > outputs/engineering/environment.txt
      - name: Lint, format, typing and repository contracts
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m compileall -q src scripts tests
          python scripts/check_repository.py
          python -m gquant validate-data --data-dir data
      - name: Engineering tests and coverage
        run: >-
          python -m pytest -q -m 'not economic' -p pytest_cov
          --cov=gquant --cov-branch --cov-report=term-missing
          --cov-report=xml:outputs/engineering/coverage.xml
          --junitxml=outputs/engineering/tests.xml
      - name: Verify reproducible wheel and installed commands
        run: python scripts/verify_distribution.py > outputs/engineering/distribution.json
      - name: Static security scan
        run: python -m bandit -r src/gquant -f json -o outputs/engineering/security.json
      - name: Verify committed source stayed unchanged
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engineering-${{ matrix.python }}-${{ env.GQUANT_SOURCE_REVISION }}
          path: outputs/engineering/
          if-no-files-found: error

  economics:
    name: Frozen economic paths, execution correctness and disclosed reference state
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.GQUANT_SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Bind evidence to actual candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GQUANT_SOURCE_REVISION"
          mkdir -p outputs/economics
          git rev-parse HEAD > outputs/economics/source-sha.txt
          git archive --format=zip HEAD -o outputs/economics/source.zip
          python -m pip freeze > outputs/economics/environment.txt
      - name: Unchanged configuration, data and full account traces
        run: python -m pytest -q tests/test_economic_oracle.py tests/test_economic_sequences.py --junitxml=outputs/economics/oracles.xml
      - name: Fixed references and disclosed diagnostics
        run: |
          set +e
          python -m gquant validate --data-dir data --output outputs/economics/acceptance --capital-scan
          status=$?
          set -e
          test "$status" -eq 1
      - name: Check published identity, execution correctness and exact reference state
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from gquant.infrastructure.artifacts import read_latest
          report = read_latest(Path('outputs/economics/acceptance'))['validation.json']
          assert report['identity']['ci_revision'] == os.environ['GQUANT_SOURCE_REVISION']
          assert report['identity']['config']['max_adv_participation'] == 0.08
          assert report['formal_configuration'] is True
          assert report['accepted'] is False
          assert report['all_reference_gates_pass'] is False
          assert report['reference_pass_count'] == 3
          assert report['execution_correct'] is True
          assert report['all_evaluated_ledgers_correct'] is True
          rows = {row['key']: row for row in report['references']}
          assert set(rows) == {'turtle_5', 'track_trend_b', 'glmcsm_6', 'momentum'}
          assert all(rows[key]['pass'] for key in ('turtle_5', 'track_trend_b', 'momentum'))
          assert rows['glmcsm_6']['pass'] is False
          assert rows['glmcsm_6']['verdict'] == {
              'return': True, 'drawdown': False, 'sharpe': True
          }
          assert report['continuous_interval']['account_reset'] is False
          assert report['capital_scan']['count'] == 24
          assert report['capital_scan']['pass_count'] == 15
          assert report['historical_diagnostic']['clean_out_of_sample'] is False
          assert len(report['robustness_diagnostics']) == 11
          assert report['profit_concentration']['optical_chain_proxy_profit_share'] > 0.99
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: economics-${{ env.GQUANT_SOURCE_REVISION }}
          path: outputs/economics/
          if-no-files-found: error

  dependency-audit:
    name: Runtime dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.GQUANT_SOURCE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Query vulnerability database for exact runtime pins
        run: |
          test "$(git rev-parse HEAD)" = "$GQUANT_SOURCE_REVISION"
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          mkdir -p outputs/security
          printf '%s\n' "$GQUANT_SOURCE_REVISION" > outputs/security/source-sha.txt
          python -m pip_audit --strict --no-deps --disable-pip -r requirements-runtime.txt --format json --output outputs/security/dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit-${{ env.GQUANT_SOURCE_REVISION }}
          path: outputs/security/
          if-no-files-found: error
