name: Recovery TDD

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths:
      - '.github/workflows/recovery-tdd.yml'
      - 'tests/test_recovery_modules.py'
      - 'src/gquant/application/operations.py'
      - 'src/gquant/application/runtime.py'
      - 'src/gquant/application/state.py'
      - 'src/gquant/execution/reconciliation.py'
      - 'src/gquant/portfolio/accounting.py'
      - 'src/gquant/research/robustness.py'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed development environment
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Recovery unit contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_recovery_modules.py
      - name: Compile and lint recovered modules
        run: |
          python -m compileall -q src/gquant
          python -m ruff check \
            src/gquant/application/operations.py \
            src/gquant/application/runtime.py \
            src/gquant/application/state.py \
            src/gquant/execution/reconciliation.py \
            src/gquant/portfolio/accounting.py \
            src/gquant/research/robustness.py \
            tests/test_recovery_modules.py
