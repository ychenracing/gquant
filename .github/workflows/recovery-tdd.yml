name: Recovery preflight

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths: ['.github/workflows/recovery-tdd.yml']

permissions:
  contents: read

# Temporary exact-HEAD preflight; remove before opening the final PR.
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed development environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Static gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m compileall -q src scripts tests
      - name: Focused correctness tests
        run: >-
          python -m pytest -q
          tests/test_account_continuation.py
          tests/test_operations.py
          tests/test_reconciliation.py
          tests/test_robustness.py
          tests/test_planner_exit_priority.py
          tests/test_execution_paths.py
          tests/test_recovery_modules.py
