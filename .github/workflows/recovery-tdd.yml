name: Recovery TDD

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths:
      - '.github/workflows/recovery-tdd.yml'
      - 'tests/test_recovery_modules.py'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify recovery contract
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_recovery_modules.py
