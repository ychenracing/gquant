name: gquant-verify
on:
  push:
    branches: [main, codex/gquant-architecture-final]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gquant-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 pytest==8.3.5
      - name: Record source identity and validate data and tests
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m pip freeze > artifacts/environment.txt
          git archive --format=zip HEAD -o artifacts/source.zip
          (cd data && sha256sum -c SHA256SUMS)
          python -m pytest tests -q --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Record source identity
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-sha.txt
          python -m pip freeze > artifacts/environment.txt
      - name: Check frozen reference gates
        run: python benchmark/scorecard.py --json artifacts/gquant-scorecard.json
      - name: Audit continuous accounts and execution
        if: ${{ !cancelled() }}
        run: python benchmark/economic_correctness.py --json artifacts/gquant-correctness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economics-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
