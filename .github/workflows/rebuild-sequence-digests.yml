name: Rebuild current economic sequence digests

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths: ['.github/workflows/rebuild-sequence-digests.yml']

permissions:
  contents: write

# Temporary recovery workflow. It deterministically regenerates the active 24-case
# digest fixture from the preserved pre-correctness case requests and current source.
jobs:
  rebuild:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Rebuild exact current path digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          from gquant.application.engine import BacktestEngine
          from gquant.config import CONFIG
          from gquant.infrastructure.configuration import make_config
          from gquant.research.metrics import summarize

          root = Path('.')
          preserved = json.loads(
              (root / 'evidence/raw/pre-correctness-economic-sequences.json').read_text(encoding='utf-8')
          )

          def digest(value: object) -> str:
              return hashlib.sha256(
                  json.dumps(value, ensure_ascii=False, separators=(',', ':')).encode()
              ).hexdigest()

          def behavior_sha() -> str:
              hasher = hashlib.sha256()
              for path in sorted((root / 'src/gquant').rglob('*.py')):
                  relative = str(path.relative_to(root)).replace('\\', '/')
                  hasher.update(relative.encode())
                  hasher.update(b'\0')
                  hasher.update(path.read_bytes())
                  hasher.update(b'\0')
              return hasher.hexdigest()

          def trace(result):
              return [
                  [
                      str(day.date()),
                      format(float(eq), '.10g'),
                      format(float(result.daily_exposure.loc[day]), '.10g'),
                      result.regime_series.loc[day],
                  ]
                  for day, eq in result.equity_curve.items()
              ]

          def fills(result):
              return [
                  [
                      str(fill.date.date()), fill.symbol, fill.side, fill.shares,
                      format(fill.price, '.10g'), format(fill.cash_after, '.10g'), fill.reason,
                  ]
                  for fill in result.trades
              ]

          cases = []
          for old in preserved['cases']:
              request = old['request']
              result = BacktestEngine(make_config(request), root / 'data').run()
              metrics = summarize(result)
              cases.append(
                  {
                      'names': old['names'],
                      'request': request,
                      'days': len(result.equity_curve),
                      'fills_count': len(result.trades),
                      'trace_sha256': digest(trace(result)),
                      'fills_sha256': digest(fills(result)),
                      'events_sha256': digest(result.events),
                      'metrics': {
                          key: float(metrics[key])
                          for key in ('total_return', 'max_drawdown', 'sharpe', 'final_equity')
                      },
                  }
              )

          output = {
              'source_repository': 'ychenracing/gquant',
              'producer_parent_sha': '772e7650e258b9484b7400aab6d092bbce4998a1',
              'behavior_sha256': behavior_sha(),
              'default_config': CONFIG,
              'data_sha256sums': hashlib.sha256((root / 'data/SHA256SUMS').read_bytes()).hexdigest(),
              'cases': cases,
          }
          target = root / 'tests/fixtures/economic-sequence-digests.json'
          target.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'generated {len(cases)} cases, behavior_sha256={output["behavior_sha256"]}')
          PY
          python -m pytest -q tests/test_economic_sequences.py
          git diff --check
      - name: Commit fixture only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/economic-sequence-digests.json
          git diff --cached --check
          git commit -m 'test: restore current economic sequence digests'
          git push origin HEAD:refs/heads/codex/gquant-correctness-operations-20260908
