name: Rebuild current economic sequence digests

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths: ['.github/workflows/rebuild-sequence-digests.yml']

permissions:
  contents: write

concurrency:
  group: rebuild-gquant-sequence-digests-${{ github.ref }}
  cancel-in-progress: true

# Temporary recovery workflow. It deterministically regenerates active economic
# path fingerprints for the current source while freezing scenario requests,
# configuration and data. Pre-correctness evidence remains immutable under evidence/raw/.
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Lock the latest branch source identity
        run: |
          set -euo pipefail
          branch=codex/gquant-correctness-operations-20260908
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          recovery_head="$(git rev-parse "refs/remotes/origin/$branch")"
          git checkout --detach "$recovery_head"
          echo "RECOVERY_HEAD=$recovery_head" >> "$GITHUB_ENV"
          echo "recovery_head=$recovery_head"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Rebuild exact current path identities
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          from gquant.application.engine import BacktestEngine
          from gquant.config import CONFIG
          from gquant.infrastructure.configuration import make_config
          from gquant.research.metrics import summarize

          root = Path('.')
          raw_oracle = json.loads(
              (root / 'evidence/raw/pre-correctness-economic-oracle.json').read_text(
                  encoding='utf-8'
              )
          )
          preserved = json.loads(
              (root / 'evidence/raw/pre-correctness-economic-sequences.json').read_text(
                  encoding='utf-8'
              )
          )

          def digest(value: object) -> str:
              return hashlib.sha256(
                  json.dumps(value, ensure_ascii=False, separators=(',', ':')).encode()
              ).hexdigest()

          def behavior_sha() -> str:
              hasher = hashlib.sha256()
              for path in sorted((root / 'src/gquant').rglob('*.py')):
                  relative = str(path.relative_to(root)).replace('\\', '/')
                  hasher.update(relative.encode())
                  hasher.update(b'\0')
                  hasher.update(path.read_bytes().replace(b'\r\n', b'\n'))
                  hasher.update(b'\0')
              return hasher.hexdigest()

          def trace(result):
              return [
                  [
                      str(day.date()),
                      format(float(eq), '.10g'),
                      format(float(result.daily_exposure.loc[day]), '.10g'),
                      result.regime_series.loc[day],
                  ]
                  for day, eq in result.equity_curve.items()
              ]

          def fills(result):
              return [
                  [
                      str(fill.date.date()), fill.symbol, fill.side, fill.shares,
                      format(fill.price, '.10g'), format(fill.cash_after, '.10g'), fill.reason,
                  ]
                  for fill in result.trades
              ]

          behavior = behavior_sha()
          config_sha = digest(CONFIG)
          data_sha = hashlib.sha256((root / 'data/SHA256SUMS').read_bytes()).hexdigest()

          oracle_path = root / 'tests/fixtures/economic-oracle.json'
          oracle = json.loads(oracle_path.read_text(encoding='utf-8'))
          if oracle['source_repository'] != 'ychenracing/gquant':
              raise SystemExit('oracle repository identity changed')
          if oracle['producer_parent_sha'] != '772e7650e258b9484b7400aab6d092bbce4998a1':
              raise SystemExit('oracle producer parent changed')
          if oracle['config_sha256'] != config_sha or raw_oracle['config_sha256'] != config_sha:
              raise SystemExit('frozen configuration identity changed')
          if (
              oracle['data_manifest_sha256'] != data_sha
              or raw_oracle['data_manifest_sha256'] != data_sha
          ):
              raise SystemExit('frozen data identity changed')

          raw_specs = {
              row['name']: (row['start'], row['end'], float(row['initial_capital']))
              for row in raw_oracle['scenarios']
          }
          active_specs = {
              row['name']: (row['start'], row['end'], float(row['initial_capital']))
              for row in oracle['scenarios']
          }
          if active_specs != raw_specs:
              raise SystemExit('frozen oracle scenario requests changed')

          refreshed = []
          for spec in oracle['scenarios']:
              request = {key: spec[key] for key in ('start', 'end', 'initial_capital')}
              result = BacktestEngine(make_config(request), root / 'data').run()
              row = dict(spec)
              row['metrics'] = summarize(result)
              row['account_sha256'] = digest(trace(result))
              row['fills_sha256'] = digest(fills(result))
              row['events_sha256'] = digest(result.events)
              refreshed.append(row)
          oracle['behavior_sha256'] = behavior
          oracle['scenarios'] = refreshed
          oracle_path.write_text(
              json.dumps(oracle, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          cases = []
          if len(preserved.get('cases', [])) != 24:
              raise SystemExit('preserved economic sequence case count is not 24')
          for old in preserved['cases']:
              request = old['request']
              result = BacktestEngine(make_config(request), root / 'data').run()
              cases.append(
                  {
                      'names': old['names'],
                      'request': request,
                      'days': len(result.equity_curve),
                      'fills_count': len(result.trades),
                      'trace_sha256': digest(trace(result)),
                      'fills_sha256': digest(fills(result)),
                      'events_sha256': digest(result.events),
                      'metrics': {
                          key: float(value)
                          for key, value in summarize(result).items()
                          if key in ('total_return', 'max_drawdown', 'sharpe', 'final_equity')
                      },
                  }
              )

          output = {
              'source_repository': 'ychenracing/gquant',
              'producer_parent_sha': '772e7650e258b9484b7400aab6d092bbce4998a1',
              'behavior_sha256': behavior,
              'default_config': CONFIG,
              'data_sha256sums': data_sha,
              'cases': cases,
          }
          target = root / 'tests/fixtures/economic-sequence-digests.json'
          target.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'generated oracle={len(refreshed)} sequence_cases={len(cases)} behavior={behavior}')
          PY
          python -m pytest -q tests/test_economic_oracle.py tests/test_economic_sequences.py
          git diff --check
      - name: Commit verified active evidence fixtures
        run: |
          set -euo pipefail
          branch=codex/gquant-correctness-operations-20260908
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          test "$(git rev-parse "refs/remotes/origin/$branch")" = "$RECOVERY_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/economic-oracle.json tests/fixtures/economic-sequence-digests.json
          git diff --cached --check
          git commit -m 'test: restore current economic evidence identities'
          git push origin HEAD:"refs/heads/$branch"
