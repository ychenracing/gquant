name: Final source and evidence rebind

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths: ['.github/workflows/final-source-evidence-rebind.yml']

permissions:
  contents: write

concurrency:
  group: final-source-evidence-rebind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Lock latest branch identity
        run: |
          set -euo pipefail
          branch=codex/gquant-correctness-operations-20260908
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          locked_head="$(git rev-parse "refs/remotes/origin/$branch")"
          git checkout --detach "$locked_head"
          echo "LOCKED_HEAD=$locked_head" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install fixed environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Apply minimal source and stale-test fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          robustness = Path('src/gquant/research/robustness.py')
          text = robustness.read_text(encoding='utf-8')
          old = 'from gquant.infrastructure.configuration import validate_config\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected robustness validate_config import state')
          text = text.replace(old, '')
          old = '''def _clone(cfg: Config) -> dict[str, Any]:\n    return copy.deepcopy(dict(cfg))\n'''
          new = '''def _clone(cfg: Config) -> Config:\n    return copy.deepcopy(cfg)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected robustness clone state')
          text = text.replace(old, new)
          for old_call, new_call in (
              ('rows.append(("ablation_rotation_sizing_equal", validate_config(equal)))',
               'rows.append(("ablation_rotation_sizing_equal", equal))'),
              ('rows.append(("ablation_pair_stop_off", validate_config(no_pair)))',
               'rows.append(("ablation_pair_stop_off", no_pair))'),
              ('rows.append((f"exclude_core_{symbol}", validate_config(raw)))',
               'rows.append((f"exclude_core_{symbol}", raw))'),
              ('rows.append(("exclude_theme_optical_chain_proxy", validate_config(optical)))',
               'rows.append(("exclude_theme_optical_chain_proxy", optical))'),
              ('rows.append(("exclude_theme_semiconductor_proxy", validate_config(semiconductor)))',
               'rows.append(("exclude_theme_semiconductor_proxy", semiconductor))'),
          ):
              if text.count(old_call) != 1:
                  raise SystemExit(f'unexpected robustness call state: {old_call}')
              text = text.replace(old_call, new_call)
          robustness.write_text(text, encoding='utf-8')

          planner = Path('src/gquant/strategy/planner.py')
          text = planner.read_text(encoding='utf-8')
          old = '''            if tilt:\n                tilt_src = {\n                    "volume": ind["volume_ratio"].loc[day],\n                    "ret63": ind["ret63"].loc[day],\n                    "ret20": ind["ret20"].loc[day],\n                    "momentum": ranks,\n                }[tilt_factor]\n'''
          new = '''            if tilt:\n                if tilt_factor == "volume":\n                    tilt_src = ind["volume_ratio"].loc[day]\n                elif tilt_factor == "momentum":\n                    tilt_src = ranks\n                else:\n                    tilt_src = ind[tilt_factor].loc[day]\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected planner tilt selection state')
          planner.write_text(text.replace(old, new), encoding='utf-8')

          application_test = Path('tests/test_application.py')
          text = application_test.read_text(encoding='utf-8')
          old = '-0.02757322781761684'
          new = '-0.02762197368224517'
          if text.count(old) != 1:
              raise SystemExit('unexpected continuous interval assertion state')
          application_test.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m ruff format \
            src/gquant/research/robustness.py \
            src/gquant/strategy/planner.py \
            tests/test_application.py
      - name: Verify engineering fixes before evidence rebind
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m compileall -q src scripts tests
          python scripts/check_repository.py
          python -m gquant validate-data --data-dir data
          python -m pytest -q \
            tests/test_planner_exit_priority.py::test_rotation_full_exit_overrides_earlier_partial_risk_trim \
            tests/test_application.py::test_backtest_publishes_continuous_account \
            tests/test_robustness.py tests/test_recovery_modules.py tests/test_research_services.py tests/test_operations.py
      - name: Rebind source identity only if all economic paths are unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          from pathlib import Path

          from gquant.application.engine import BacktestEngine
          from gquant.config import CONFIG
          from gquant.infrastructure.configuration import make_config
          from gquant.research.metrics import summarize

          root = Path('.')
          oracle_path = root / 'tests/fixtures/economic-oracle.json'
          sequence_path = root / 'tests/fixtures/economic-sequence-digests.json'
          oracle = json.loads(oracle_path.read_text(encoding='utf-8'))
          sequence = json.loads(sequence_path.read_text(encoding='utf-8'))

          def digest(value: object) -> str:
              return hashlib.sha256(
                  json.dumps(value, ensure_ascii=False, separators=(',', ':')).encode()
              ).hexdigest()

          def behavior_sha() -> str:
              hasher = hashlib.sha256()
              for path in sorted((root / 'src/gquant').rglob('*.py')):
                  relative = str(path.relative_to(root)).replace('\\', '/')
                  hasher.update(relative.encode())
                  hasher.update(b'\0')
                  hasher.update(path.read_bytes().replace(b'\r\n', b'\n'))
                  hasher.update(b'\0')
              return hasher.hexdigest()

          def trace(result):
              return [
                  [
                      str(day.date()),
                      format(float(eq), '.10g'),
                      format(float(result.daily_exposure.loc[day]), '.10g'),
                      result.regime_series.loc[day],
                  ]
                  for day, eq in result.equity_curve.items()
              ]

          def fills(result):
              return [
                  [
                      str(fill.date.date()), fill.symbol, fill.side, fill.shares,
                      format(fill.price, '.10g'), format(fill.cash_after, '.10g'), fill.reason,
                  ]
                  for fill in result.trades
              ]

          if digest(CONFIG) != oracle['config_sha256']:
              raise SystemExit('frozen config identity changed')
          data_sha = hashlib.sha256((root / 'data/SHA256SUMS').read_bytes()).hexdigest()
          if data_sha != oracle['data_manifest_sha256'] or data_sha != sequence['data_sha256sums']:
              raise SystemExit('frozen data identity changed')
          if len(sequence['cases']) != 24:
              raise SystemExit('active sequence case count changed')

          metric_keys = ('total_return', 'max_drawdown', 'sharpe', 'final_equity')
          for case in oracle['scenarios']:
              request = {key: case[key] for key in ('start', 'end', 'initial_capital')}
              result = BacktestEngine(make_config(request), root / 'data').run()
              if digest(trace(result)) != case['account_sha256']:
                  raise SystemExit(f"oracle account drift: {case['name']}")
              if digest(fills(result)) != case['fills_sha256']:
                  raise SystemExit(f"oracle fill drift: {case['name']}")
              if digest(result.events) != case['events_sha256']:
                  raise SystemExit(f"oracle event drift: {case['name']}")
              metrics = summarize(result)
              for key in metric_keys:
                  if not math.isclose(
                      float(metrics[key]), float(case['metrics'][key]), rel_tol=1e-12, abs_tol=1e-10
                  ):
                      raise SystemExit(f"oracle metric drift: {case['name']} {key}")

          for case in sequence['cases']:
              result = BacktestEngine(make_config(case['request']), root / 'data').run()
              if len(result.equity_curve) != case['days'] or len(result.trades) != case['fills_count']:
                  raise SystemExit(f"sequence count drift: {case['names'][0]}")
              if digest(trace(result)) != case['trace_sha256']:
                  raise SystemExit(f"sequence account drift: {case['names'][0]}")
              if digest(fills(result)) != case['fills_sha256']:
                  raise SystemExit(f"sequence fill drift: {case['names'][0]}")
              if digest(result.events) != case['events_sha256']:
                  raise SystemExit(f"sequence event drift: {case['names'][0]}")
              metrics = summarize(result)
              for key in metric_keys:
                  if not math.isclose(
                      float(metrics[key]), float(case['metrics'][key]), rel_tol=1e-12, abs_tol=1e-10
                  ):
                      raise SystemExit(f"sequence metric drift: {case['names'][0]} {key}")

          behavior = behavior_sha()
          if behavior == oracle['behavior_sha256']:
              raise SystemExit('source behavior identity unexpectedly unchanged')
          oracle['behavior_sha256'] = behavior
          sequence['behavior_sha256'] = behavior
          oracle_path.write_text(json.dumps(oracle, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          sequence_path.write_text(json.dumps(sequence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'economic paths unchanged; rebound behavior_sha256={behavior}')
          PY
          python -m pytest -q tests/test_economic_oracle.py tests/test_economic_sequences.py
      - name: Full engineering and formal economic verification
        run: |
          set -euo pipefail
          python -m pytest -q -m 'not economic'
          rm -rf outputs/final-rebind-validation
          set +e
          python -m gquant validate --data-dir data --output outputs/final-rebind-validation --capital-scan
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          from pathlib import Path
          import pytest
          from gquant.infrastructure.artifacts import read_latest
          report = read_latest(Path('outputs/final-rebind-validation'))['validation.json']
          assert report['reference_pass_count'] == 3
          assert report['accepted'] is False
          assert report['execution_correct'] is True
          assert report['all_evaluated_ledgers_correct'] is True
          assert report['capital_scan']['pass_count'] == 15
          rows = {row['key']: row for row in report['references']}
          assert rows['glmcsm_6']['verdict'] == {'return': True, 'drawdown': False, 'sharpe': True}
          assert report['full_window']['total_return'] == pytest.approx(12.073443491514363)
          assert report['full_window']['max_drawdown'] == pytest.approx(-0.1407956526125117)
          assert report['continuous_interval']['return'] == pytest.approx(-0.02762197368224517)
          PY
          git diff --check
      - name: Commit source fixes and rebound evidence
        run: |
          set -euo pipefail
          branch=codex/gquant-correctness-operations-20260908
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          test "$(git rev-parse "refs/remotes/origin/$branch")" = "$LOCKED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/gquant/research/robustness.py \
            src/gquant/strategy/planner.py \
            tests/test_application.py \
            tests/fixtures/economic-oracle.json \
            tests/fixtures/economic-sequence-digests.json
          git diff --cached --check
          git commit -m 'fix: close remaining architecture and planner contracts'
          git push origin HEAD:"refs/heads/$branch"
