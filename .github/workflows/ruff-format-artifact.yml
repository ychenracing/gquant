name: Ruff format artifact

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths: ['.github/workflows/ruff-format-artifact.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Apply repository-pinned Ruff formatter
        run: |
          python -m pip install --disable-pip-version-check ruff==0.12.12
          python -m ruff format \
            src/gquant/application/operations.py \
            src/gquant/application/runtime.py \
            src/gquant/application/state.py \
            src/gquant/research/robustness.py \
            tests/test_operations.py \
            tests/test_recovery_modules.py
          python -m ruff check .
          python -m ruff format --check .
      - name: Commit only formatter changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/gquant/application/operations.py \
            src/gquant/application/runtime.py \
            src/gquant/application/state.py \
            src/gquant/research/robustness.py \
            tests/test_operations.py \
            tests/test_recovery_modules.py
          git diff --cached --check
          git commit -m 'style: apply repository Ruff formatter'
          git push origin HEAD:codex/gquant-correctness-operations-20260908
