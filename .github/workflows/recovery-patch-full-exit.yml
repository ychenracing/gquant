name: Recovery full-exit patch

on:
  push:
    branches: [codex/gquant-correctness-operations-20260908]
    paths:
      - '.github/recovery_patch_full_exit.py'
      - '.github/workflows/recovery-patch-full-exit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Apply the single reviewed planner change
        run: python .github/recovery_patch_full_exit.py
      - name: Verify the regression test
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          PYTHONPATH=src python -m pytest -q tests/test_planner_exit_priority.py
          python -m ruff check src/gquant/strategy/planner.py tests/test_planner_exit_priority.py
          git diff --check
      - name: Commit planner only
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/gquant/strategy/planner.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gquant/strategy/planner.py
          git commit -m 'fix: let full rotation exits dominate partial trims'
          git push origin HEAD:refs/heads/codex/gquant-correctness-operations-20260908
